name: Build Presence App

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download JavaFX Windows SDK
        run: |
          curl -L -o javafx-win.zip "https://download2.gluonhq.com/openjfx/21.0.2/openjfx-21.0.2_windows-x64_bin-sdk.zip"
          Expand-Archive -Path javafx-win.zip -DestinationPath javafx-win
          echo "JAVAFX_PATH=${{ github.workspace }}\javafx-win\javafx-sdk-21.0.2\lib" >> $env:GITHUB_ENV

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: List target contents
        run: Get-ChildItem target

      - name: Copy JavaFX libs into input
        run: Copy-Item -Path "$env:JAVAFX_PATH\*" -Destination target -Recurse -Force

      - name: List target after copy
        run: Get-ChildItem target

      - name: Test JAR with JavaFX module path
        run: java --module-path "$env:JAVAFX_PATH" --add-modules javafx.controls,javafx.fxml -jar target/presence-app-1.0-SNAPSHOT.jar
        continue-on-error: true

      - name: Run jpackage for Windows
        run: |
          jpackage `
            --input target `
            --name Presence `
            --main-jar presence-app-1.0-SNAPSHOT.jar `
            --main-class com.presence.App `
            --type app-image `
            --icon src/main/resources/icons/icon.ico `
            --app-version 1.0.0 `
            --vendor "AnzilottiChristopher" `
            --description "Presence - Stay connected" `
            --java-options "--module-path ${'$'}APPDIR --add-modules javafx.controls,javafx.fxml" `
            --dest output

      - name: List output contents
        run: Get-ChildItem output/Presence
        continue-on-error: true

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Presence-Windows
          path: output/Presence

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download JavaFX Mac SDK
        run: |
          curl -L -o javafx-mac.zip "https://download2.gluonhq.com/openjfx/21.0.2/openjfx-21.0.2_osx-aarch64_bin-sdk.zip"
          unzip javafx-mac.zip -d javafx-mac
          echo "JAVAFX_PATH=${{ github.workspace }}/javafx-mac/javafx-sdk-21.0.2/lib" >> $GITHUB_ENV

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Copy JavaFX libs into input
        run: cp -r "$JAVAFX_PATH/." target/

      - name: Test JAR with JavaFX module path
        run: java --module-path "$JAVAFX_PATH" --add-modules javafx.controls,javafx.fxml -jar target/presence-app-1.0-SNAPSHOT.jar
        continue-on-error: true

      - name: Convert PNG to ICNS
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     src/main/resources/icons/icon_1024.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     src/main/resources/icons/icon_1024.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     src/main/resources/icons/icon_1024.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     src/main/resources/icons/icon_1024.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   src/main/resources/icons/icon_1024.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   src/main/resources/icons/icon_1024.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   src/main/resources/icons/icon_1024.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   src/main/resources/icons/icon_1024.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   src/main/resources/icons/icon_1024.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 src/main/resources/icons/icon_1024.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset

      - name: Run jpackage for Mac
        run: |
          jpackage \
            --input target \
            --name Presence \
            --main-jar presence-app-1.0-SNAPSHOT.jar \
            --main-class com.presence.App \
            --type dmg \
            --icon icon.icns \
            --app-version 1.0.0 \
            --vendor "AnzilottiChristopher" \
            --description "Presence - Stay connected" \
            --java-options "--module-path \$APPDIR --add-modules javafx.controls,javafx.fxml" \
            --dest output

      - name: Upload Mac installer
        uses: actions/upload-artifact@v4
        with:
          name: Presence-Mac
          path: output/*.dmg
